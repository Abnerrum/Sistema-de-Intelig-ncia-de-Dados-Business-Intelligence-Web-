<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Dash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #16213e; color: white; border-radius: 15px; border: none; }
        .form-control { background: #0f3460; border: none; color: white; }
    </style>
</head>
<body>
    <div class="card p-4 shadow-lg" style="width: 350px;">
        <h3 class="text-center mb-4">Acesso</h3>
        <form action="/login" method="POST">
            <input type="text" name="username" class="form-control mb-3" placeholder="Usuário (admin)" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Senha (123)" required>
            <button class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
</body>
</html>
